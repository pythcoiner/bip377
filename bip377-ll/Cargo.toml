[package]
name = "bip377-ll"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Dependency-free codec for BIP-377, the signing message encoding"
license = "MIT"
authors = ["pythcoiner <pythcoiner@wizardsardine.com>"]
repository = "https://github.com/pythcoiner/bip377"
documentation = "https://docs.rs/bip377-ll"
# The tests load their vectors from the repo-level `test_vectors/`, outside the crate.
include = ["Cargo.toml", "README.md", "src/**/*.rs", "include/*.h", "examples/*.c"]
publish = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
ffi = []
