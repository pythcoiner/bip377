[package]
name = "bip377-ll"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "Dependency-free codec for the draft QR signing protocol"
license = "MIT"
authors = ["pythcoiner <pythcoiner@wizardsardine.com>"]
repository = "https://github.com/pythcoiner/bip377"
documentation = "https://docs.rs/bip377-ll"
publish = true

[lib]
path = "src/lib.rs"

[dev-dependencies]
serde_json = "1.0"

[features]
default = []
ffi = []
